name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read package information
        shell: bash
        run: |
          PACKAGE_NAME="$(jq -r '.name' package.json)"
          VERSION="$(jq -r '.version' package.json)"
          test -n "$PACKAGE_NAME" && test "$PACKAGE_NAME" != "null"
          test -n "$VERSION" && test "$VERSION" != "null"
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP_FILE=${PACKAGE_NAME}-${VERSION}.zip" >> "$GITHUB_ENV"

      - name: Validate release URL
        shell: bash
        run: |
          EXPECTED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${ZIP_FILE}"
          ACTUAL_URL="$(jq -r '.url' package.json)"
          if [ "$ACTUAL_URL" != "$EXPECTED_URL" ]; then
            echo "Expected: $EXPECTED_URL"
            echo "Actual:   $ACTUAL_URL"
            exit 1
          fi

      - name: Create VPM package staging directory
        shell: bash
        run: |
          mkdir -p dist/package
          cp -R Editor Runtime dist/package/
          cp package.json README.md CHANGELOG.md LICENSE dist/package/

      - name: Verify excluded files
        shell: bash
        run: |
          if [ -e "dist/package/Tests" ] || [ -e "dist/package/Test" ]; then exit 1; fi
          if find dist/package/Editor -type f -name '*Tests.cs' | grep -q .; then exit 1; fi

      - name: Create VPM zip
        shell: bash
        run: |
          (cd dist/package && zip -r "../../${ZIP_FILE}" .)

      - name: Create SHA256
        shell: bash
        run: |
          sha256sum "${ZIP_FILE}" > "${ZIP_FILE}.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists."
            exit 1
          fi
          gh release create "${VERSION}"             "${ZIP_FILE}"             "${ZIP_FILE}.sha256"             "package.json"             --title "${VERSION}"             --notes "On/Off Menu Item Setup Supporter ${VERSION}"
